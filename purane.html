<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>पुराने गीत / 2026</title>

  <style>
    #progressWrap {
  cursor: pointer;
  touch-action: none;
  user-select: none;
}

#progressWrap .progress {
  cursor: pointer;
  touch-action: none;
}
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Arial, sans-serif;
      color: #fff;
      background: #222;
      overflow-x: hidden;
    }
.scene {
  position: fixed;
  inset: 0;
  z-index: -2;
  overflow: hidden;
}
   

   .scene img {
  width: 100%;
  height: 100%;
  object-fit: fill;
  object-position: center center;
}

    .overlay {
      position: absolute;
      inset: 0;
      background: rgba(0,0,0,.42);
    }

    main {
      width: min(1150px, 92%);
      margin: auto;
    }

    nav {
      min-height: 90px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
    }

    .brand {
      font-size: 20px;
      font-weight: 700;
    }

    .nav-note {
      opacity: .8;
      font-size: 13px;
    }

    .live-users {
      font-size: 12px;
      opacity: .8;
    }

    .live-users i {
      display: inline-block;
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: #b7d96b;
      margin-right: 5px;
    }

    .hero {
      min-height: calc(100vh - 90px);
      display: flex;
      align-items: center;
      padding: 40px 0 170px;
    }

    .eyebrow {
      font-size: 13px;
      letter-spacing: 1px;
      opacity: .85;
      margin-bottom: 15px;
    }

    h1 {
      margin: 0;
      font-size: clamp(48px, 8vw, 92px);
      line-height: .95;
      max-width: 850px;
    }

    h1 em {
      display: block;
      font-style: normal;
      opacity: .75;
    }

    .intro {
      max-width: 650px;
      margin: 25px 0;
      line-height: 1.7;
      font-size: 16px;
      opacity: .9;
    }

    .metadata {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 25px;
    }

    .tag {
      padding: 8px 12px;
      border: 1px solid rgba(255,255,255,.25);
      border-radius: 999px;
      background: rgba(0,0,0,.18);
      font-size: 11px;
    }

    /* DROPDOWN */
    .playlist-switcher {
      position: relative;
      display: inline-block;
      margin-top: 10px;
    }

    .playlist-option {
      width: 130px;
      height: 42px;
      border: 1px solid rgba(255,255,255,.35);
      border-radius: 999px;
      background: rgba(40,40,40,.45);
      color: #fff;
      cursor: pointer;
      font-size: 12px;
    }

    .playlist-menu {
      display: none;
      position: absolute;
      left: 0;
      top: calc(100% + 7px);
      width: 130px;
      padding: 4px;
      border-radius: 13px;
      background: rgba(35,35,35,.94);
      border: 1px solid rgba(255,255,255,.25);
      z-index: 100;
    }

    .playlist-switcher.is-open .playlist-menu {
      display: grid;
      gap: 2px;
    }

    .playlist-choice {
      border: 0;
      background: transparent;
      color: #fff;
      padding: 6px 8px;
      border-radius: 8px;
      text-align: left;
      font-size: 11px;
      cursor: pointer;
    }

    .playlist-choice:hover,
    .playlist-choice.is-active {
      background: rgba(255,255,255,.14);
    }

    .quote-box {
      margin-top: 35px;
      max-width: 500px;
      padding: 20px;
      border-left: 2px solid rgba(255,255,255,.5);
      background: rgba(0,0,0,.12);
    }

    .quote {
      margin: 0 0 8px;
      font-size: 18px;
    }

    .quote-author {
      margin: 0;
      opacity: .7;
      font-size: 12px;
    }

    .offer {
      position: fixed;
      left: 50%;
      bottom: 22px;
      transform: translateX(-50%);
      width: min(900px, 92%);
      padding: 14px 18px;
      display: flex;
      align-items: center;
      gap: 22px;
      border: 1px solid rgba(255,255,255,.2);
      border-radius: 20px;
      background: rgba(20,20,20,.72);
      backdrop-filter: blur(14px);
      z-index: 50;
    }

    .transport {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .control {
      width: 38px;
      height: 38px;
      border: 1px solid rgba(255,255,255,.2);
      border-radius: 50%;
      background: rgba(255,255,255,.08);
      color: #fff;
      cursor: pointer;
    }

    .main-control {
      width: 44px;
      height: 44px;
    }

    .play-state {
      display: none;
    }

    .song {
      flex: 1;
      min-width: 0;
    }

    .song-top {
      display: flex;
      justify-content: space-between;
      gap: 10px;
      font-size: 12px;
      margin-bottom: 8px;
    }

    #track {
      overflow: hidden;
      white-space: nowrap;
      text-overflow: ellipsis;
    }

    .progress-wrap {
      cursor: pointer;
    }

    .progress {
      height: 4px;
      border-radius: 10px;
      background: rgba(255,255,255,.2);
      overflow: hidden;
    }

    .progress i {
      display: block;
      width: 0;
      height: 100%;
      background: #fff;
    }

    .volume {
      font-size: 11px;
      opacity: .7;
    }

    @media (max-width: 700px) {
      nav {
        flex-wrap: wrap;
        padding: 15px 0;
      }

      .nav-note {
        display: none;
      }

      .hero {
        padding-top: 40px;
      }

      .offer {
        gap: 10px;
        padding: 10px;
      }

      .side-controls {
        display: none;
      }
    }
   
  </style>
</head>


<body>

  <!-- Papa ke zamane wali image -->
  <div class="scene">
    <img src="papa.png" alt="">
    <div class="overlay"></div>
  </div>

  <main>

    <nav>
      <div class="brand">पुराने गीत / 2026</div>

      <div class="nav-note">
        यादों के वो पुराने सुर
      </div>

      <div class="live-users" aria-live="polite">
        <i></i>
        <span id="liveUsers">0 live</span>
      </div>
    </nav>

    <section class="hero">

      <div>

        <div class="eyebrow">
          पुराने गीत · सुनहरी यादें
        </div>

        <h1>
          पुराने <em>गीत</em>
        </h1>

       <p class="intro">
  सफ़र पुराना है, मगर हर धुन आज भी दिल के करीब है।
</p>

        <div class="metadata">
          <span class="tag">पुराने नगमे</span>
          <span class="tag">यादें · संगीत · सफर</span>
          <span class="tag">दिल से सुनिए</span>
        </div>

        <!-- DROPDOWN -->
        <div class="playlist-switcher">

          <button
            class="playlist-option"
            id="playlistSelect"
            type="button"
            aria-expanded="false">
            पुराने गीत ▾
          </button>

          <div
            class="playlist-menu"
            id="playlistMenu">

            <button
              class="playlist-choice is-active"
              data-playlist="purane">
              पुराने गीत
            </button>

            <button
              class="playlist-choice"
              data-playlist="chhath">
              छठ पूजा
            </button>

            <button
              class="playlist-choice"
              data-playlist="navratri">
              नवरात्रि
            </button>

            <button
              class="playlist-choice"
              data-playlist="bhojpuri">
              भोजपुरी
            </button>
            <button
              class="playlist-choice"
              data-playlist="jhadu-pocha">
              झाड़ू-पोछा🧹
      
            </button>
             <button
              class="playlist-choice"
              data-playlist="papa">
              📻पापा के ज़माने के गाने 
            </button>

          </div>
        </div>

        <div class="quote-box">
          <p class="quote">
            “पुराने गीतों में आज भी पुरानी यादें जिंदा हैं।”
          </p>

          <p class="quote-author">
            — एक पुरानी याद
          </p>
        </div>

      </div>

    </section>

  </main>

  <!-- PLAYER -->
  <section class="offer">

    <div class="transport">

      <button class="control" id="prev">⏮</button>

      <button class="control main-control" id="play">
        ▶
      </button>

      <button class="control" id="next">⏭</button>

    </div>

    <div class="song">

      <div class="song-top">
        <span id="track">पुराने गीत संग्रह</span>
        <span id="time">00:00</span>
      </div>

      <div class="progress-wrap" id="progressWrap">
        <div class="progress">
          <i id="bar"></i>
        </div>
      </div>

    </div>

    <div class="side-controls">
      <span class="volume">
        पुराने सुर
      </span>
    </div>

  </section>

  <audio id="audio" preload="metadata"></audio>
  <script src="tracks/purane-tracks.js"></script>

<script>
  const audio = document.getElementById("audio");
  const play = document.getElementById("play");
  const prev = document.getElementById("prev");
  const next = document.getElementById("next");
  const bar = document.getElementById("bar");
  const time = document.getElementById("time");
  const track = document.getElementById("track");

let files = window.remainingPuraneTrackFiles || [];

let urls = files.map(file =>
  "tracks/purane/" + encodeURIComponent(file)
);

let current = 0;

  // PURANE SONGS GITHUB SE AUTOMATICALLY LOAD
  if (files.length > 0) {
  loadTrack(0);
} else {
  track.textContent = "पुराने गीत जल्द जुड़ेंगे";
}
console.log("Purane songs:", files);
  

  function loadTrack(index, shouldPlay = false) {
    if (!files.length) return;

    current = (index + files.length) % files.length;

    audio.src = urls[current];

    track.textContent = files[current].replace(/\.mp3$/i, "");

    audio.load();

    if (shouldPlay) {
      audio.play().catch(error => {
        console.log("Play error:", error);
      });
    }
  }

  play.onclick = () => {
    if (!files.length) return;

    if (audio.paused) {
      audio.play().catch(error => {
        console.log("Play error:", error);
      });
    } else {
      audio.pause();
    }
  };

  prev.onclick = () => {
    loadTrack(current - 1, true);
  };

  next.onclick = () => {
    loadTrack(current + 1, true);
  };

  audio.addEventListener("play", () => {
    play.textContent = "⏸";
  });

  audio.addEventListener("pause", () => {
    play.textContent = "▶";
  });

  audio.addEventListener("timeupdate", () => {
    const duration = audio.duration || 0;
    const currentTime = audio.currentTime || 0;

    bar.style.width =
      duration ? (currentTime / duration * 100) + "%" : "0%";

    time.textContent =
      String(Math.floor(currentTime / 60)).padStart(2, "0") +
      ":" +
      String(Math.floor(currentTime % 60)).padStart(2, "0");
  });
  // ===== SONG PROGRESS: CLICK + MOBILE TOUCH/DRAG =====

const progressWrap = document.getElementById("progressWrap");

function seekSong(clientX) {
  if (!audio.duration) return;

  const rect = progressWrap.getBoundingClientRect();

  let position = (clientX - rect.left) / rect.width;

  // 0% se 100% ke beech rakho
  position = Math.max(0, Math.min(1, position));

  audio.currentTime = position * audio.duration;
}

// Laptop: mouse click
progressWrap.addEventListener("click", (e) => {
  seekSong(e.clientX);
});

// Mobile + laptop: finger/mouse drag
progressWrap.addEventListener("pointerdown", (e) => {
  if (!audio.duration) return;

  e.preventDefault();

  progressWrap.setPointerCapture(e.pointerId);

  seekSong(e.clientX);
});

progressWrap.addEventListener("pointermove", (e) => {
  if (e.buttons === 1) {
    seekSong(e.clientX);
  }
});

progressWrap.addEventListener("pointerup", (e) => {
  if (progressWrap.hasPointerCapture(e.pointerId)) {
    progressWrap.releasePointerCapture(e.pointerId);
  }
});

  audio.addEventListener("ended", () => {
    loadTrack(current + 1, true);
  });


  /* DROPDOWN */

  const playlistSelect =
    document.getElementById("playlistSelect");

  const playlistSwitcher =
    document.querySelector(".playlist-switcher");

  playlistSelect.onclick = (e) => {
    e.stopPropagation();

    const isOpen =
      playlistSwitcher.classList.toggle("is-open");

    playlistSelect.setAttribute(
      "aria-expanded",
      isOpen
    );
  };

  document.querySelectorAll(".playlist-choice")
    .forEach(option => {

      option.onclick = (e) => {
        e.stopPropagation();

        const playlist =
          option.dataset.playlist;

        if (playlist === "purane") {
          window.location.href = "purane.html";
        }

        if (playlist === "chhath") {
          window.location.href = "index.html";
        }
if (playlist === "navratri") {
  window.location.href = "index.html?playlist=navratri";
}

        if (playlist === "bhojpuri") {
          window.location.href = "bhojpuri.html";
        }
        
        if (playlist === "jhadu-pocha") {
          window.location.href = "jhadu-pocha.html";
        }
       if (playlist === "papa") {
  window.location.href = "tracks/papa.html";
}
      };

    });

  document.addEventListener("click", () => {
    playlistSwitcher.classList.remove("is-open");

    playlistSelect.setAttribute(
      "aria-expanded",
      "false"
    );
  });


  // SONGS START LOAD


</script>
  <script type="module" src="presence.js"></script>
</body>
</html>

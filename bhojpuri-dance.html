<!doctype html>
<html lang="hi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>भोजपुरी डांस</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #120619; }
    .video { position: relative; width: min(100vw, 960px); aspect-ratio: 16 / 9; overflow: hidden; background: #000; }
    .frame { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; animation: dance 1s steps(1, end) infinite; }
    .frame.two { animation-delay: .5s; }
    @keyframes dance { 0%, 49.99% { opacity: 1; } 50%, 100% { opacity: 0; } }
    .frame.two { opacity: 0; }
    .label { position: absolute; left: 50%; bottom: 24px; transform: translateX(-50%); z-index: 2; padding: 8px 18px; border-radius: 999px; color: #fff6da; background: #210826c7; font: 700 clamp(16px, 3vw, 28px)/1 system-ui, sans-serif; letter-spacing: .04em; }
  </style>
</head>
<body>
  <main class="video" aria-label="नाचती हुई भैंस और गाय का भोजपुरी डांस वीडियो">
    <img class="frame" src="assets/bhojpuri-dance-1.png" alt="चश्मा पहनी भैंस और गाय नाच रही हैं" />
    <img class="frame two" src="assets/bhojpuri-dance-2.png" alt="चश्मा पहनी भैंस और गाय दूसरे डांस पोज़ में हैं" />
    <div class="label">भोजपुरी डांस</div>
  </main>
</body>
</html>
